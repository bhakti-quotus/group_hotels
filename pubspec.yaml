name: sunswept
description: "A new Flutter project."
publish_to: "none"  

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10
  url_launcher: ^6.2.6
  google_maps_flutter: ^2.5.0
  http: ^1.2.1
  flutter_dotenv: ^5.1.0
  cupertino_icons: ^1.0.8
  share_plus: ^10.0.2
  path_provider: ^2.1.3
  qr_flutter: ^4.1.0
  image_picker: ^0.8.7+4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  device_info_plus: ^12.3.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  video_player: ^2.10.1
  chewie: ^1.7.5
  webview_flutter: ^4.4.0
  webview_flutter_android: ^3.12.0
  webview_flutter_wkwebview: ^3.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  hive_generator: ^1.1.0  

flutter_launcher_icons:
  android: true
  ios: true
